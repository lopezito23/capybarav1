<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un mensaje para ti ♡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 45%,#fff0f5 0,#fbe3ef 42%,#e9c7e3 100%);font-family:Georgia,'Times New Roman',serif;color:#6f3157}
canvas{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;width:55vmin;height:55vmin;left:50%;top:44%;transform:translate(-50%,-50%);border-radius:50%;background:#fff7fb;filter:blur(34px);opacity:.8;pointer-events:none}
.message{position:absolute;left:50%;top:76%;transform:translate(-50%,18px) scale(.96);width:94%;text-align:center;opacity:0;transition:opacity 1.5s ease,transform 1.5s cubic-bezier(.2,.8,.2,1);pointer-events:none;text-shadow:0 0 14px #fff,0 0 30px #ffb8dc}
.message.show{opacity:1;transform:translate(-50%,0) scale(1)}
.line1{font-size:clamp(27px,5vw,54px);font-style:italic;letter-spacing:.015em;color:#a43d70}
.line2{margin-top:8px;font-size:clamp(18px,3vw,29px);color:#9c5479}
.heart{display:inline-block;color:#ed6aa5;animation:beat 1.15s infinite;filter:drop-shadow(0 0 9px #ff8dc5)}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.22)}35%{transform:scale(1)}52%{transform:scale(1.14)}}
.hint{position:absolute;bottom:18px;left:0;width:100%;text-align:center;font:11px/1.4 system-ui,sans-serif;letter-spacing:.18em;color:#a56e91;opacity:.7}
.petal{position:fixed;z-index:5;top:-30px;width:12px;height:18px;border-radius:100% 0 100% 0;background:linear-gradient(140deg,#fff0f5,#e94f87 55%,#b51f55);box-shadow:0 1px 5px #d94b8066;opacity:.82;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(540deg);opacity:0}}
</style></head>
<body><div class="glow"></div><canvas id="art"></canvas>
<div class="message" id="message"><div class="line1">Te amo bastante, pequeña <span class="heart">♡</span></div><div class="line2">Eres una personita muy especial para mí. <span class="heart">♥</span></div></div>

let W,H,D,scale=1,ox=0,oy=0;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0);scale=Math.min(W/760,H/850,1.05);ox=W/2;oy=H*.43;}
addEventListener('resize',()=>{resize();drawProgress(progress)});resize();
const ops=[];
let px=0,py=0,heading=0,pen=true,fillColor='black',penColor='black',penSize=6,fillPts=null,shape='turtle';
function screen(x,y){return [ox+x*scale,oy-y*scale]}
function recordLine(x1,y1,x2,y2,color,width){ops.push({type:'line',a:[x1,y1],b:[x2,y2],color,width})}
function goto(x,y){if(pen)recordLine(px,py,x,y,penColor,penSize);px=x;py=y;if(fillPts)fillPts.push([x,y])}
function go(x,y){pen=false;goto(x,y);pen=true}
function arco(direc,radio,ang){
 heading=direc*Math.PI/180;
 const r=radio, extent=ang*Math.PI/180;
 if(Math.abs(r)<.0001){heading+=extent;return}
 const sign=Math.sign(r);
 const cx=px-Math.sin(heading)*r, cy=py+Math.cos(heading)*r;
 const start=Math.atan2(py-cy,px-cx);
 const steps=Math.max(2,Math.ceil(Math.abs(extent)*Math.max(8,Math.abs(r)/4)));
 for(let i=1;i<=steps;i++){
   const a=start+extent*sign*i/steps;
   const nx=cx+Math.cos(a)*Math.abs(r),ny=cy+Math.sin(a)*Math.abs(r);
   goto(nx,ny);
 }
 heading+=extent*sign;
}
function linea(direc,longitud){heading=direc*Math.PI/180;goto(px+Math.cos(heading)*longitud,py+Math.sin(heading)*longitud)}
const t={
 pensize(n){penSize=n},shape(s){shape=s},fillcolor(c){fillColor=c},pencolor(c){penColor=c},
 penup(){pen=false},pendown(){pen=true},goto(x,y){goto(x,y)},seth(d){heading=d*Math.PI/180},
 forward(n){goto(px+Math.cos(heading)*n,py+Math.sin(heading)*n)},
 circle(r,a=360){arco(heading*180/Math.PI,r,a)},
 begin_fill(){fillPts=[[px,py]]},
 end_fill(){if(fillPts&&fillPts.length>2)ops.push({type:'fill',pts:fillPts.slice(),color:fillColor});fillPts=null}
};

buildDrawing();

function drawProgress(p){
 ctx.clearRect(0,0,W,H);
 const total=ops.length, upto=Math.floor(total*p);
 for(let i=0;i<upto;i++){
  const o=ops[i];
  if(o.type==='fill'){
   const pts=o.pts.map(q=>screen(q[0],q[1]));ctx.beginPath();ctx.moveTo(...pts[0]);for(let j=1;j<pts.length;j++)ctx.lineTo(...pts[j]);ctx.closePath();ctx.fillStyle=o.color;ctx.shadowColor=o.color==='DarkSalmon'?'#f2a0b5':'transparent';ctx.shadowBlur=7;ctx.fill();ctx.shadowBlur=0;
  }else{
   const a=screen(...o.a),b=screen(...o.b);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=o.color;ctx.lineWidth=Math.max(1,o.width*scale);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }
 }
}
let progress=0,done=false;
function animate(){
 progress=Math.min(1,progress+.0035);
 drawProgress(progress);
 if(progress>=1&&!done){done=true;setTimeout(()=>{document.getElementById('message').classList.add('show');document.getElementById('hint').style.opacity='0';},500);setInterval(makePetal,520);}
 if(!done)requestAnimationFrame(animate);
}
function makePetal(){
 const el=document.createElement('i');
 el.className='petal';
 const size=8+Math.random()*11;
 el.style.left=Math.random()*100+'%';
 el.style.width=size+'px';
 el.style.height=(size*1.45)+'px';
 el.style.background=`linear-gradient(${100+Math.random()*100}deg,#fff0f5,${['#f7a1c4','#ec5a91','#d93670','#c9275b'][Math.floor(Math.random()*4)]} 58%,#9f1747)`;
 el.style.setProperty('--drift',(Math.random()*240-120)+'px');
 el.style.animationDuration=(6+Math.random()*7)+'s';
 el.style.animationDelay=(Math.random()*0.6)+'s';
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),14000);
}
// Empieza la lluvia de pétalos desde el inicio y continúa suavemente.

setInterval(makePetal,260);
